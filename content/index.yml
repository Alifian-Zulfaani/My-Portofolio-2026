faq:
  title: Frequently Asked Questions
  description: Answers to common questions about my process and services.
  categories:
    - title: Services & Process
      questions:
        - label: What services do you offer?
          content: |
            I specialize in full-stack web development, focusing on modern frameworks like Nuxt.js and Vue.js. This includes building responsive web applications, REST/GraphQL APIs, database design, deployment automation, and creating design systems. My goal is to deliver complete, production-ready solutions.
        - label: What is your development process like?
          content: |
            My process is collaborative and iterative, typically involving Discovery & Planning, Architecture Design, Incremental Development with regular check-ins, Testing & QA, and Deployment. I tailor the process based on project needs, always focusing on clean code and maintainability.
        - label: Do you work with startups?
          content: |
            Absolutely! I enjoy working with startups to help build their MVP and scale their product. I can adapt my process to fit the fast-paced startup environment while maintaining code quality.
    - title: Pricing & Timelines
      questions:
        - label: How much does a project typically cost?
          content: |
            Project costs vary based on scope, complexity, and timeline. For comprehensive full-stack projects, my engagements typically start around $5,000, with average projects ranging between $8,000 and $25,000. For consulting or specific tasks, my day rate is $700.
        - label: How long does a typical project take?
          content: |
            Timelines depend on the project's scope and complexity. Smaller projects might take 2-4 weeks, while larger, more involved projects can range from 2 to 4 months. I always provide a detailed timeline estimate after the initial discovery phase.
        - label: Do you offer ongoing support?
          content: |
            Yes, for clients needing ongoing development, feature additions, or maintenance, I offer monthly retainer options tailored to specific needs. Let's discuss if this is something you're interested in.
    - title: About Me
      questions:
        - label: What do you enjoy most about your work?
          content: |
            I love the challenge of solving complex problems through elegant code. It's incredibly rewarding to see users interact with something I've built and find it genuinely useful. Building the bridge between great design and robust engineering is what excites me most.
        - label: What are your hobbies outside of work?
          content: |
            When I'm not coding, I enjoy exploring new technologies, contributing to open-source projects, gaming, and staying up to date with the latest in web development. I'm also passionate about mentoring junior developers.
