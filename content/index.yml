faq:
  title: Frequently Asked Questions
  description: Answers to common questions about my background, tech stack, and collaboration.
  categories:
    - title: Expertise & Workflow
      questions:
        - label: What is your primary tech stack?
          content: |
            I specialize in Full-Stack Web Development, with a strong focus on modern frontend frameworks like Vue.js and Nuxt.js, as well as React.js and Next.js. On the backend, I am experienced with Laravel, Node.js, building REST APIs, and working with databases like MySQL and PostgreSQL.
        - label: How do you approach project development and code quality?
          content: |
            I value clean code, simplicity, and maintainability. My approach focuses on understanding the problem deeply, design patterns, clean architecture, and building performant applications that feel snappy and responsive for the end user.
        - label: Are you comfortable working with remote teams?
          content: |
            Absolutely. I have experience working with distributed teams and utilizing tools like Git, Postman, Figma, and modern communication platforms to maintain clear, efficient workflows and collaborate successfully.
    - title: Collaboration & Opportunities
      questions:
        - label: Are you open to full-time employment or roles?
          content: |
            Yes! I am open to full-time positions, remote roles, or collaborations that match my skills. I am always looking for opportunities where I can contribute to building great products and grow alongside a talented team.
        - label: What kinds of projects are you most interested in?
          content: |
            I enjoy working on products that solve real-world problems with elegant solutions. I am particularly interested in projects focusing on clean architecture, modern web standards, and scaling applications to deliver the best user experience.
        - label: How can we get in touch or discuss opportunities?
          content: |
            You can reach out to me directly via the contact form/details on this website, or email me directly. I am always happy to connect, share ideas, and discuss how I can add value to your team.
    - title: Personal & Hobbies
      questions:
        - label: What drives your passion for software development?
          content: |
            I love the challenge of turning complex requirements into simple, beautiful, and functional applications. Seeing how users interact with something I built and finding it genuinely useful is the most rewarding part of my work.
        - label: What do you enjoy doing outside of coding?
          content: |
            When I'm not coding, I enjoy exploring new technologies, contributing to open-source projects, gaming, and staying up to date with the latest in web development. I'm also passionate about mentoring junior developers and sharing knowledge.
