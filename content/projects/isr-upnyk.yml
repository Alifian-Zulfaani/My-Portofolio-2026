title: ISR UPNYK
description: Website resmi UKM Interdisciplinary Scientific Research (ISR) Universitas Pembangunan Nasional Veteran Yogyakarta. Dibangun menggunakan Laravel 10 dan Tailwind CSS v3 dengan backoffice admin menggunakan Filament PHP v3. Menyediakan manajemen keanggotaan UKM, dokumentasi kegiatan, integrasi Google Drive, dan fitur interaktif komunitas.
